<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EKI CHAIN</title></head><body style="background:#000;color:#0f0;font-family:monospace;padding:20px">
<h2>EKI CHAIN - PIX 32468719816</h2>
<input id="carteira" placeholder="EKI_..." style="width:100%;padding:10px"><br><br>
<button onclick="criarCarteira()" style="width:100%;padding:15px;background:green;color:black;font-weight:bold">Criar Carteira</button><br><br>
<button onclick="verSaldo()" style="width:100%;padding:15px;background:gray">Ver Saldo</button><br><br>
<input id="qtd" value="500" style="width:45%;padding:10px">
<button onclick="venderEKI()" style="width:50%;padding:10px;background:red;color:white">VENDER</button>
<script>
function criarCarteira(){
  const id="EKI_"+Date.now()+"_"+Math.random().toString(36).substr(2,5).toUpperCase();
  localStorage.setItem("eki_id",id);
  if(!localStorage.getItem("eki_saldo")) localStorage.setItem("eki_saldo","10000");
  document.getElementById("carteira").value=id;
  alert("Criada: "+id+"\nSaldo: 10000 EKI liberado");
}
function verSaldo(){
  const id=localStorage.getItem("eki_id")||document.getElementById("carteira").value;
  const saldo=localStorage.getItem("eki_saldo")||"0";
  if(!id.includes("EKI_")){alert("Cria carteira primeiro");return;}
  alert("Carteira: "+id+"\n\nSALDO PRA VENDER: "+saldo+" EKI\nPIX: 32468719816\nValor R$ "+(parseInt(saldo)*0.01).toFixed(2));
}
function venderEKI(){
  let saldo=parseInt(localStorage.getItem("eki_saldo")||"0");
  let qtd=parseInt(document.getElementById("qtd").value||"500");
  if(saldo<qtd){alert("Saldo insuficiente: "+saldo);return;}
  saldo-=qtd;
  localStorage.setItem("eki_saldo",saldo);
  alert("VENDEU "+qtd+" EKI\nRecebe R$ "+(qtd*0.01).toFixed(2)+" no PIX 32468719816\nRestante: "+saldo);
}
</script>
</body></html>
